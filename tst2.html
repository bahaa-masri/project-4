<!doctype html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Example: Responsive Mobile Menu (Fixed)</title>
    <style>
        /* -----------------------------
       Responsive mobile drawer (LTR)
       Fixes: proper hidden state, transform animation,
       focus trap, ESC close, body scroll lock
       ----------------------------- */
        :root {
            --bg: #0f1724;
            /* dark navy */
            --card: #0b1220;
            --accent: #06b6d4;
            /* teal */
            --muted: #94a3b8;
            --max-width: 1100px;
            --drawer-width: 300px;
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg), #071021 120%);
            color: #e6eef6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.45;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 20px;
        }

        /* Top header */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            backdrop-filter: blur(6px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            display: inline-grid;
            place-items: center;
            font-weight: 700;
            color: #04263b
        }

        .site-title {
            font-weight: 600
        }

        .site-tag {
            font-size: 12px;
            color: var(--muted)
        }

        /* Desktop nav */
        nav.desktop-nav {
            display: none;
            gap: 18px;
            align-items: center
        }

        nav.desktop-nav a {
            color: inherit;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 8px
        }

        nav.desktop-nav a:hover {
            background: rgba(255, 255, 255, 0.02)
        }

        /* Hamburger */
        .hamburger {
            display: inline-grid;
            place-items: center;
            width: 46px;
            height: 46px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: transparent;
            cursor: pointer
        }

        .hamburger .bar {
            width: 20px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            position: relative;
            transition: transform .25s ease, opacity .25s ease
        }

        .hamburger .bar::before,
        .hamburger .bar::after {
            content: "";
            position: absolute;
            left: 0;
            width: 20px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            transition: transform .25s ease, top .25s ease, bottom .25s ease
        }

        .hamburger .bar::before {
            top: -6px
        }

        .hamburger .bar::after {
            bottom: -6px
        }

        .hamburger[aria-expanded="true"] .bar {
            transform: rotate(45deg)
        }

        .hamburger[aria-expanded="true"] .bar::before {
            transform: rotate(-90deg);
            top: 0
        }

        .hamburger[aria-expanded="true"] .bar::after {
            opacity: 0
        }

        /* Overlay + drawer */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.5);
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s ease;
            z-index: 40
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto
        }

        .mobile-drawer {
            position: fixed;
            top: 0;
            bottom: 0;
            right: 0;
            width: var(--drawer-width);
            background: var(--card);
            box-shadow: -20px 0 40px rgba(2, 6, 23, 0.6);
            padding: 18px;
            z-index: 50;
            border-radius: 12px 0 0 12px;
            transform: translateX(100%);
            transition: transform .28s cubic-bezier(.2, .9, .22, 1);
            will-change: transform
        }

        .mobile-drawer.open {
            transform: translateX(0)
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .drawer-nav {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .drawer-nav a {
            display: block;
            padding: 10px;
            border-radius: 8px;
            color: inherit;
            text-decoration: none
        }

        .drawer-nav a:hover {
            background: rgba(255, 255, 255, 0.02)
        }

        .drawer-cta {
            margin-top: 18px
        }

        .btn {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 9px;
            background: var(--accent);
            color: #012;
            font-weight: 600;
            text-decoration: none
        }

        main {
            padding: 28px 0
        }

        .hero {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent);
            padding: 24px;
            border-radius: 12px
        }

        @media(min-width:820px) {
            .hamburger {
                display: none
            }

            nav.desktop-nav {
                display: flex
            }

            .mobile-drawer,
            .overlay {
                display: none
            }
        }

        a:focus,
        button:focus {
            outline: 3px solid rgba(6, 182, 212, 0.18);
            outline-offset: 3px
        }
    </style>
</head>

<body>
    <header class="container" role="banner">
        <div class="topbar">
            <!-- <div class="brand">
                <div class="logo">MH</div>
                <div>
                    <div class="site-title">My Website</div>
                    <div class="site-tag">Responsive Mobile Menu</div>
                </div>
            </div> -->

            <nav class="desktop-nav" aria-label="Main navigation">
                <a href="#">Homee</a>
                <a href="#">Products</a>
                <a href="#">Services</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>

            <button class="hamburger" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
                <span class="bar" aria-hidden="true"></span>
            </button>
        </div>
    </header>

    <div class="overlay" id="overlay" tabindex="-1" aria-hidden="true"></div>

    <aside class="mobile-drawer" id="mobile-menu" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="drawer-header">
            <div style="display:flex;align-items:center;gap:10px">
                <div class="logo" style="width:40px;height:40px">MH</div>
                <div>
                    <div class="site-title">My Website</div>
                    <div class="site-tag">Menu</div>
                </div>
            </div>
            <button id="close-drawer" aria-label="Close menu"
                style="background:transparent;border:0;color:inherit;font-size:20px;cursor:pointer">✕</button>
        </div>

        <nav class="drawer-nav" aria-label="Mobile navigation">
            <a href="#home">Homeee</a>
            <a href="#products">Products</a>
            <a href="#services">Services</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>

        <!-- <div class="drawer-cta">
            <a class="btn" href="#">Sign up</a>
        </div> -->
    </aside>




    <main class="container" id="main-content">
        <section class="hero">
            <h1>Welcome 👋</h1>
            <p>This is a clean example of a responsive mobile drawer menu with overlay, ESC close, focus trapping, and
                proper accessibility handling.</p>
        </section>

        <section style="margin-top:18px">
            <h2 id="products">Sections</h2>
            <p style="color:var(--muted)">Placeholder content to test navigation.</p>
        </section>
    </main>

    <script>
        const hamburger = document.querySelector('.hamburger');
        const drawer = document.getElementById('mobile-menu');
        const overlay = document.getElementById('overlay');
        const closeBtn = document.getElementById('close-drawer');
        const mainContent = document.getElementById('main-content');
        const focusableSelector = 'a, button, input, [tabindex]:not([tabindex="-1"])';

        let lastFocused = null;

        function openMenu() {
            lastFocused = document.activeElement;
            hamburger.setAttribute('aria-expanded', 'true');
            drawer.classList.add('open');
            overlay.classList.add('open');
            drawer.setAttribute('aria-hidden', 'false');
            overlay.setAttribute('aria-hidden', 'false');
            mainContent.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = 'hidden';

            const focusables = drawer.querySelectorAll(focusableSelector);
            (focusables[0] || closeBtn).focus();

            document.addEventListener('keydown', trapTab, true);
        }

        function closeMenu() {
            hamburger.setAttribute('aria-expanded', 'false');
            drawer.classList.remove('open');
            overlay.classList.remove('open');
            drawer.setAttribute('aria-hidden', 'true');
            overlay.setAttribute('aria-hidden', 'true');
            mainContent.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = '';

            if (lastFocused) lastFocused.focus();
            document.removeEventListener('keydown', trapTab, true);
        }

        function toggleMenu() {
            hamburger.getAttribute('aria-expanded') === 'true' ? closeMenu() : openMenu();
        }

        function trapTab(e) {
            if (e.key === 'Escape') { closeMenu(); return; }
            if (e.key !== 'Tab') return;

            const focusables = Array.from(drawer.querySelectorAll(focusableSelector));
            if (!focusables.length) return;
            const first = focusables[0];
            const last = focusables[focusables.length - 1];

            if (e.shiftKey && document.activeElement === first) {
                e.preventDefault(); last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
                e.preventDefault(); first.focus();
            }
        }

        hamburger.addEventListener('click', toggleMenu);
        closeBtn.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);

        drawer.addEventListener('click', (e) => {
            if (e.target.closest('a')) closeMenu();
        });

        function checkWidth() {
            if (window.innerWidth >= 820) closeMenu();
        }
        window.addEventListener('resize', checkWidth);
        checkWidth();
    </script>
</body>

</html>
